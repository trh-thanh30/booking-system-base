<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Static Markdown API documentation for booking-system-base."
    />
    <title>Booking API Docs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="min-h-dvh bg-paper text-ink antialiased">
    <a
      href="#doc-content"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-brand focus:shadow"
      >Skip to content</a
    >

    <div class="min-h-dvh lg:grid lg:grid-cols-[18rem_1fr]">
      <aside class="border-b border-line bg-white lg:fixed lg:inset-y-0 lg:left-0 lg:w-72 lg:border-b-0 lg:border-r">
        <div class="flex h-full flex-col">
          <div class="border-b border-line px-4 py-4">
            <p class="text-xs font-medium uppercase tracking-normal text-brand">
              booking-system-base
            </p>
            <h1 class="mt-1.5 text-lg font-semibold leading-tight text-slate-950">
              API Docs
            </h1>
            <p class="mt-2 text-xs leading-5 text-muted">
              Trình đọc tài liệu tĩnh. Nội dung được lấy từ file Markdown.
            </p>
          </div>

          <nav
            id="doc-nav"
            class="flex flex-col gap-1 overflow-x-auto px-2.5 py-2.5 lg:flex-1 lg:overflow-y-auto"
            aria-label="Docs navigation"
          ></nav>

          <div class="hidden border-t border-line p-3 text-xs leading-5 text-muted lg:block">
            <p class="font-medium text-slate-800">Chạy docs</p>
            <code class="kbd mt-2 inline-block">pnpm dev:docs</code>
            <p class="mt-3">Port riêng: <code class="kbd">8000</code></p>
          </div>
        </div>
      </aside>

      <main class="lg:col-start-2">
        <header class="border-b border-line bg-white/90 px-4 py-4 backdrop-blur sm:px-8">
          <div class="mx-auto flex max-w-5xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <p id="doc-eyebrow" class="text-xs font-medium uppercase tracking-normal text-brand">
                markdown
              </p>
              <h2 id="doc-title" class="mt-1 text-2xl font-semibold text-slate-950">
                Đang tải tài liệu
              </h2>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="rounded-md border border-line bg-blue-50 px-2.5 py-1 font-medium text-blue-800">
                Base API <code class="font-mono">/api/v1</code>
              </span>
              <span class="rounded-md border border-line bg-blue-50 px-2.5 py-1 font-medium text-blue-800">
                Static <code class="font-mono">HTML + MD</code>
              </span>
            </div>
          </div>
        </header>

        <section class="px-4 py-8 sm:px-8">
          <article
            id="doc-content"
            class="doc-content mx-auto max-w-5xl rounded-lg border border-line bg-white px-5 py-6 shadow-sm sm:px-8 sm:py-8"
            aria-live="polite"
          >
            <p class="text-muted">Đang tải tài liệu...</p>
          </article>
        </section>
      </main>
    </div>

    <script src="./assets/docs.js"></script>
  </body>
</html>
